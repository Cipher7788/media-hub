# monitoring.yaml – Monitoring & Alerting Configuration

monitoring:
  # Prometheus scrape interval hint (informational; set in prometheus.yml).
  scrape_interval: "15s"

  threat_detection:
    # Rolling window for rate-limit calculations.
    window: "1m"
    # Requests per minute per source IP before an alert is raised.
    max_rpm: 300

  alerting:
    # Log alerts at WARNING level (always enabled).
    log: true
    # Webhook URL for external alerting (e.g. Slack, PagerDuty).
    # webhook_url: "https://hooks.example.com/alert"

# Prometheus federation scrape targets (informational).
prometheus:
  scrape_configs:
    - job_name: "proxy"
      static_configs:
        - targets: ["localhost:9090"]
    - job_name: "exit-node"
      static_configs:
        - targets: ["exit-node:9091"]
