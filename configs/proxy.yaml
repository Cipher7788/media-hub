# proxy.yaml – Core Proxy Engine Configuration
# All duration values accept Go duration syntax (e.g. "30s", "5m").

proxy:
  # TCP address the proxy listens on.
  listen_addr: ":8080"
  # Timeouts.
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "90s"
  # Number of relay hops in the anonymisation circuit (minimum 1).
  circuit_hops: 3

# Firewall rules are evaluated in order; the first matching rule wins.
# The default action when no rule matches is "allow".
firewall:
  default_action: "allow"
  rules:
    # Block RFC 1918 private ranges to prevent server-side request forgery.
    - name: "block-rfc1918-10"
      type: "cidr"
      cidr: "10.0.0.0/8"
      action: "block"
    - name: "block-rfc1918-172"
      type: "cidr"
      cidr: "172.16.0.0/12"
      action: "block"
    - name: "block-rfc1918-192"
      type: "cidr"
      cidr: "192.168.0.0/16"
      action: "block"
    - name: "block-loopback"
      type: "cidr"
      cidr: "127.0.0.0/8"
      action: "block"
    # Example: block a specific domain.
    # - name: "block-malware-example"
    #   type: "domain"
    #   domain: "malware.example.com"
    #   action: "block"

# Deep Packet Inspection – protocols listed here are blocked.
dpi:
  blocked_protocols:
    - "BitTorrent"
    - "P2P"

# Anonymisation circuit relay nodes.
# In production, populate this list with your relay infrastructure.
anonymize:
  replace_user_agent: true
  strip_referer: true
  strip_cookies: false
  relay_nodes:
    # - addr: "relay1.example.com:4001"
    #   weight: 10
    # - addr: "relay2.example.com:4001"
    #   weight: 10

# Tracking prevention.
tracking:
  # Additional tracker domains beyond the built-in list.
  extra_trackers: []
  # - "custom-ads.example.com"

# Metrics server.
metrics:
  listen_addr: ":9090"
  path: "/metrics"
